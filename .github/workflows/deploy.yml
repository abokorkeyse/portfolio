name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # CI: Verification & Quality Check
  verify:
    name: Verify & Validate Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Essential Files
        run: |
          echo "Verifying production assets..."
          test -f index.html || { echo "index.html missing!"; exit 1; }
          test -f style.css || { echo "style.css missing!"; exit 1; }
          test -f app.js || { echo "app.js missing!"; exit 1; }
          test -f cv.html || { echo "cv.html missing!"; exit 1; }
          test -f privacy.html || { echo "privacy.html missing!"; exit 1; }
          test -f terms.html || { echo "terms.html missing!"; exit 1; }
          test -f 404.html || { echo "404.html missing!"; exit 1; }
          test -f manifest.webmanifest || { echo "manifest missing!"; exit 1; }
          test -f sw.js || { echo "sw.js missing!"; exit 1; }
          echo "All core assets verified successfully."

      - name: Syntax & Lint Validation
        run: |
          echo "Validating JavaScript syntax..."
          node --check app.js
          node --check sw.js
          echo "Syntax verification passed."

  # CD: Deploy to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
